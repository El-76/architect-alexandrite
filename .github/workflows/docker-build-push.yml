name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, alexandrite ]
    paths:
      - 'Task3/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  ORDERS_SERVICE_IMAGE_NAME: ${{ github.repository }}/orders-service
  MODELS_SERVICE_IMAGE_NAME: ${{ github.repository }}/models-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Orders Service
        id: meta-orders
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORDERS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Orders Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Task3/services/orders
          push: true
          tags: ${{ steps.meta-orders.outputs.tags }}
          labels: ${{ steps.meta-orders.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Models Service
        id: meta-models
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MODELS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Models Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Task3/services/models
          push: true
          tags: ${{ steps.meta-models.outputs.tags }}
          labels: ${{ steps.meta-models.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

